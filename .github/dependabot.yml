version: 2

updates:
  # npm — the root manifest covers every packages/* workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # One PR per week for all minor/patch bumps and one for all majors.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # better-auth 1.7 changes the socialProviders types and breaks the sign-in
      # integration tests. Ignore only 1.7 and above, so 1.6.x patches still
      # arrive. Drop this entry once the 1.7 migration lands.
      - dependency-name: better-auth
        versions:
          - ">= 1.7.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"

  # Python — every packages/* dir with a pyproject.toml + uv.lock. The
  # sandbox-images/locks/python-tools project is left out: `sandbox:images lock`
  # generates it from the image tool manifest, so edits to it fail the
  # freshness check.
  - package-ecosystem: uv
    directories:
      - /packages/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major

  # Base images in Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /packages/control-plane
      - /packages/sandbox-images
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"

  # Base images in docker-compose*.yml at the repo root.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /terraform/environments/*
      - /terraform/modules/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      terraform:
        patterns:
          - "*"
    ignore:
      # The cloudflare provider is deliberately held below 5.20.0 (worker
      # observability regression, cloudflare/terraform-provider-cloudflare#7177).
      # Ignore only the versions at or above that bound, so updates inside the
      # allowed range still arrive. Drop this entry once that is fixed upstream.
      - dependency-name: cloudflare/cloudflare
        versions:
          - ">= 5.20.0"
