version: 2

updates:
  # npm — the root manifest covers every packages/* workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # One PR per week for all minor/patch bumps and one for all majors.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # better-auth 1.7 changes the socialProviders types and breaks the sign-in
      # integration tests. Ignore only 1.7 and above, so 1.6.x patches still
      # arrive. Drop this entry once the 1.7 migration lands.
      - dependency-name: better-auth
        versions:
          - ">= 1.7.0"
      # eslint 10 is outside eslint-plugin-react's peer range, so npm install
      # fails with ERESOLVE. Drop these entries once the plugin supports 10.
      - dependency-name: eslint
        versions:
          - ">= 10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">= 10.0.0"
      # TypeScript 7 (the native rewrite) is outside typescript-eslint's peer
      # range (<6.1.0), so npm ci fails with ERESOLVE and no CI job runs. Drop
      # this entry once typescript-eslint supports it.
      - dependency-name: typescript
        versions:
          - ">= 6.1.0"
      # packages/web is on Tailwind 3 and moving to 4 is a config migration
      # (CSS-first config replaces tailwind.config.ts). packages/docs is already
      # on 4, so hold only major jumps and keep its 4.x updates flowing. Drop
      # this entry once packages/web has migrated.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # Types track the Node runtime (.nvmrc is 24). Raise together with .nvmrc.
      - dependency-name: "@types/node"
        versions:
          - ">= 25.0.0"
      # eslint-plugin-react-hooks 7 turns on the React Compiler rules, which fail
      # packages/web lint with 89 errors (setState in effects, refs read during
      # render). Drop this entry once COD-2264 fixes them.
      - dependency-name: eslint-plugin-react-hooks
        versions:
          - ">= 7.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"

  # Python — every packages/* dir with a pyproject.toml + uv.lock. The
  # sandbox-images/locks tree is left out: `sandbox:images lock` generates it
  # from the image tool manifest and the runtime uv.lock, so edits to it fail
  # the freshness check. The dependabot-image-locks workflow regenerates it on
  # each Dependabot PR instead.
  - package-ecosystem: uv
    directories:
      - /packages/*
    exclude-paths:
      - "packages/sandbox-images/locks/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # modal 1.6 removes Function.get_raw_f and Function.get_build_def, which the
      # modal-infra tests use to introspect functions (deprecated in 1.5). Ignore
      # only 1.6 and above so 1.5.x patches still arrive. Drop this entry once the
      # tests stop using those two methods.
      - dependency-name: modal
        versions:
          - ">= 1.6.0"

  # Base images in Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /packages/control-plane
      - /packages/sandbox-images
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"

  # Base images in docker-compose*.yml at the repo root.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /terraform/environments/*
      - /terraform/modules/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      terraform:
        patterns:
          - "*"
    ignore:
      # The cloudflare provider is deliberately held below 5.20.0 (worker
      # observability regression, cloudflare/terraform-provider-cloudflare#7177).
      # Ignore only the versions at or above that bound, so updates inside the
      # allowed range still arrive. Drop this entry once that is fixed upstream.
      - dependency-name: cloudflare/cloudflare
        versions:
          - ">= 5.20.0"
