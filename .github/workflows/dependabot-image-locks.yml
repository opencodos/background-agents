name: Dependabot image locks

# Dependabot bumps packages/sandbox-runtime/uv.lock but cannot run
# `sandbox:images lock`, so the exported image locks go stale and the
# Sandbox Images freshness check fails. This regenerates them on the PR branch.
#
# The push uses a GitHub App token so the new commit triggers CI; a
# GITHUB_TOKEN push would not. Dependabot-triggered runs only see Dependabot
# secrets, so GH_APP_ID and GH_APP_PRIVATE_KEY must be set there.

on:
  pull_request:
    paths:
      - "packages/sandbox-runtime/uv.lock"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
      - name: Regenerate image locks
        run: python3 packages/sandbox-images/cli.py lock
      - name: Commit and push
        run: |
          if git diff --quiet -- packages/sandbox-images/locks; then
            echo "Image locks already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sandbox-images/locks
          git commit -m "chore: regenerate sandbox image locks"
          git push
